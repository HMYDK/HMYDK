name: profile

# The profile page is a build artifact: GitHub API -> JSON -> SVG -> README.
# Rebuild daily, on demand, or whenever the pipeline itself changes.
on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC / 11:17 Asia-Shanghai
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: collect telemetry (GitHub GraphQL + Atom feed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: HMYDK
        run: node scripts/collect.mjs

      - name: render SVG cards + README
        run: node scripts/render.mjs

      - name: commit refreshed artifacts
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md data/profile.json assets; then
            echo "::notice::artifacts unchanged; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/profile.json assets
          git commit -m "chore(profile): rebuild telemetry $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push
